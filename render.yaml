services:
  - type: web
    name: ecommerce-api
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    branch: main
    rootDir: ecommerce-mauri-herrera7
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'node ./node_modules/typeorm/cli.js migration:run -d ./dist/config/typeorm.js && exec node dist/main'
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - ecommerce-mauri-herrera7/**
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-api-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "10"
      - key: ENABLE_SWAGGER
        value: "true"

databases:
  - name: ecommerce-api-db
    databaseName: ecommerce
    user: ecommerce
    region: virginia
    plan: 0.5c-1g
    diskSizeGB: 5
    postgresMajorVersion: "16"
    storageAutoscalingEnabled: true
    ipAllowList: []
